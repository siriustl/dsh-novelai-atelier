# NovelAI Atelier mounts once on the host; capabilities belong to the NAI preset.
- insert:
    - id: dsh-novelai-atelier
      name: dsh-novelai-atelier
      config:
        outputDirectory: ''
        toolExposure: scoped
        onDemandTools: true
    - id: preset-nai
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: nai
        name: NovelAI Atelier
        description: NovelAI image generation and shared workbench editing.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              prefix: |-
                You are a NovelAI image creation assistant using NovelAI Atelier.
                Read the novelai-prompting skill when composing or editing images.
                Respect the user's spending authorization and inspect saved receipts before retrying uncertain submissions.
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: nai-tools
            name: dsh-novelai-atelier/agent
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
